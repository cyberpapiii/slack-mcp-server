name: Integration Tests
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      SLACK_MCP_OPENAI_API: ${{ secrets.SLACK_MCP_OPENAI_API }}
      SLACK_MCP_XOXP_TOKEN: ${{ secrets.SLACK_MCP_XOXP_TOKEN }}
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    steps:
      - name: Check integration credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SLACK_MCP_OPENAI_API" && -n "$SLACK_MCP_XOXP_TOKEN" && -n "$NGROK_AUTH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live integration tests skipped because repository secrets are unavailable."
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        if: steps.credentials.outputs.available == 'true'
        run: make deps

      - name: Run integration tests
        if: steps.credentials.outputs.available == 'true'
        run: make test-integration
