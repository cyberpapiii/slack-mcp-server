name: Release NPM

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Release
    if: github.repository == 'korotovsky/slack-mcp-server'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install dependencies
        run: npm install -g @anthropic-ai/dxt

      - name: Build binaries
        run: make build-all-platforms

      - name: Build DTX Extension
        run: make build-dxt

      - name: Upload artifacts
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            LICENSE
            build/slack-mcp-server-*
            build/slack-mcp-server.dxt
            .env.dist
            docker-compose.yml

      - name: Publish npm
        run:
          make npm-publish
